services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: rbac-rag-backend
    ports:
      - "8000:8000"
    env_file:
      - .env

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: rbac-rag-frontend
    ports:
      - "8501:8501"
    environment:
      - API_URL=http://backend:8000
    depends_on:
      - backend